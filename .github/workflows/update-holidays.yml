name: Update Holidays Data

on:
  schedule:
    # 毎週月曜 09:00 JST (00:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.fetch.outputs.status }}
      pr-number: ${{ steps.cpr.outputs.pull-request-number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Fetch and convert holidays data
        id: fetch
        run: |
          set +e
          npm run fetch
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ]; then
            echo "status=changed" >> $GITHUB_OUTPUT
          elif [ $EXIT_CODE -eq 1 ]; then
            echo "::notice::No changes detected - skipping"
            echo "status=skipped" >> $GITHUB_OUTPUT
          else
            echo "::error::Error occurred (exit code: $EXIT_CODE)"
            echo "status=error" >> $GITHUB_OUTPUT
            exit $EXIT_CODE
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.fetch.outputs.status == 'changed'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update holidays data"
          title: "chore: update holidays data"
          body: |
            祝日データが更新されました。

            - Source: https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html
            - Auto-generated by GitHub Actions
          branch: update-holidays-data
          delete-branch: true

  automerge:
    needs: update
    if: needs.update.outputs.status == 'changed' && needs.update.outputs.pr-number != ''
    runs-on: ubuntu-latest
    steps:
      - name: Merge pull request
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
        env:
          PR_NUMBER: ${{ needs.update.outputs.pr-number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN によるマージでは push イベントで deploy.yml が起動しないため明示的に実行
      - name: Trigger deploy
        run: gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
